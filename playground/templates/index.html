<html>
<head>
    <title>My Store</title>
    <style>
        body {
            background: #1e1e1e;
            color: #e0e0e0;
            font-family: 'Segoe UI', 'Courier New', monospace;
            margin: 40px;
            line-height: 1.6;
        }
        h1 {
            font-size: 2.8em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #ff8c42;
            border-bottom: 4px solid #ff8c42;
            padding-bottom: 12px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0 #2a2a2a;
        }
        p {
            font-size: 1.3em;
            color: #b0b0b0;
            margin-top: -5px;
            font-style: italic;
        }
        ul {
            list-style: none;
            padding: 0;
            margin-top: 30px;
            border-left: 5px solid #ff8c42;
            background: #262626;
            border-radius: 0 12px 12px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        li {
            padding: 16px 24px;
            background: #2d2d2d;
            border-bottom: 2px solid #3a3a3a;
            font-weight: 600;
            font-size: 1.15em;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        li:last-child {
            border-bottom: none;
            border-radius: 0 0 12px 0;
        }
        li:hover {
            background: #3a3a3a;
            padding-left: 32px;
            border-left: 6px solid #ffa64d;
            color: #fff;
        }
        li:active {
            transform: scale(0.98);
            background: #444;
        }
        .product-price {
            color: #ff8c42;
            font-weight: 700;
            background: #1e1e1e;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9em;
        }
        .cart-feedback {
            margin-top: 30px;
            padding: 14px 20px;
            background: #2a2a2a;
            border-left: 6px solid #4caf50;
            border-radius: 8px;
            font-size: 1.1em;
            color: #cfcfcf;
            display: none;
            transition: opacity 0.3s;
        }
        .cart-feedback.show {
            display: block;
            animation: fadeIn 0.4s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .btn-reset {
            background: #ff8c42;
            border: none;
            color: #1e1e1e;
            font-weight: bold;
            padding: 10px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 20px;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-reset:hover {
            background: #ffa64d;
            transform: scale(1.02);
        }
        .btn-reset:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>
    <h1>Welcome to My Store</h1>
    <p>Here are some of our products — click any to add to cart!</p>
    <ul id="product-list">
        {% for product in products %}
            <li data-title="{{ product.title }}" data-price="{{ product.price }}">
                <span>{{ product.title }}</span>
                <span class="product-price">${{ product.price|floatformat:2 }}</span>
            </li>
        {% endfor %}
    </ul>

    <div id="cart-feedback" class="cart-feedback">
        🛒 Added <strong id="last-added"></strong> to your cart!
    </div>

    <button class="btn-reset" id="reset-btn">🧹 Clear Cart</button>

    <script>
        const feedback = document.getElementById('cart-feedback');
        const lastAdded = document.getElementById('last-added');
        const productList = document.getElementById('product-list');

        productList.addEventListener('click', function(e) {
            const li = e.target.closest('li');
            if (!li) return;
            const title = li.dataset.title;
            const price = li.dataset.price;
            lastAdded.textContent = `${title} — ${price}`;
            feedback.classList.add('show');
            // Optional: log to console
            console.log(`Added to cart: ${title} (${price})`);
        });

        document.getElementById('reset-btn').addEventListener('click', function() {
            feedback.classList.remove('show');
            lastAdded.textContent = '';
        });
    </script>
</body>
</html>
